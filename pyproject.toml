[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracevault"
version = "0.3.0"
description = "Local-first OSINT and digital forensics research workspace"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "StyxHQ"}]
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.0",
    "networkx>=3.0",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/raxwqx/TRACEVAULT"
Repository = "https://github.com/raxwqx/TRACEVAULT"

[tool.setuptools]
packages = ["tracevault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
